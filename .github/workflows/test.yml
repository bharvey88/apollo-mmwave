name: Test

on:
  push:
    branches:
      - "main"
  pull_request:

permissions: {}

jobs:
  pytest:
    name: "pytest"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.3"

      - name: Install test requirements
        run: |
          uv venv
          uv pip install -r requirements-test.txt

      - name: Run pytest
        run: uv run --no-project pytest tests/ -q

  frontend:
    name: "vitest + bundle sync"
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: frontend-src
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run vitest
        run: npm test

      - name: Build and verify the committed bundles are current
        run: |
          npm run build
          git diff --exit-code ../custom_components/apollo_mmwave/www
