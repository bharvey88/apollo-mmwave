update_zone:
  name: Update Zone
  description: "Create, update, clear, or delete a zone. Geometry is in millimetres (Y-down). To clear a zone send data: null, or set shape: none. Set delete: true to remove the zone and its entities. Rotation and tracked entities are device-wide and can be updated without zone_id."
  fields:
    device_id:
      name: Radar Device
      description: The radar these zones belong to. Required unless the deprecated location field is given.
      required: false
      example: 4f8a2b1c9d3e5f70a1b2c3d4e5f60718
      selector:
        device: {}
    location:
      name: Location Name (deprecated)
      description: "Deprecated: use device_id instead. Matches the device's stored display name from before 2.0 and will be removed in a future release. One of device_id or location must be given."
      required: false
      example: Office
      selector:
        text: {}
    zone_id:
      name: Zone ID
      description: The numeric zone identifier (1..N)
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 32
    shape:
      name: Shape
      description: Shape of the zone (none, rect, ellipse, polygon). Use 'none' to clear.
      required: false
      selector:
        select:
          options:
            - none
            - rect
            - ellipse
            - polygon
    data:
      name: Shape Data
      description: "Shape data object or null. For rect: {x_min,x_max,y_min,y_max}. For ellipse: {cx,cy,rx,ry}. For polygon: {points:[{x,y},...]}. Use null to clear."
      required: false
      selector:
        object: {}
    name:
      name: Zone Name
      description: Optional friendly name for the zone. When provided, entity friendly names will be updated.
      required: false
      selector:
        text: {}
    delete:
      name: Delete Zone
      description: If true, deletes the zone and removes the associated entities for this zone.
      required: false
      selector:
        boolean: {}
    rotation_deg:
      name: Rotation Angle (deg)
      description: Optional device rotation angle (-180..180). Device-wide; if provided without zone fields, only the angle is updated for the device.
      required: false
      selector:
        number:
          min: -180
          max: 180
          step: 1
    entities:
      name: Tracked Entities
      description: Optional list of x/y entity id pairs to evaluate presence. Device-wide; a non-empty list replaces the stored list. An empty list means no change, so a card that has not finished loading cannot wipe your pairs. Use clear_entities to empty the list. Ignored when clear_entities is true.
      required: false
      selector:
        object: {}
      example: |
        - { x: sensor.device_target_1_x, y: sensor.device_target_1_y }
        - { x: sensor.device_target_2_x, y: sensor.device_target_2_y }
    clear_entities:
      name: Clear Tracked Entities
      description: If true, empties the tracked entity pair list for this device. The device then tracks nothing instead of falling back to its own LD2450 targets. Takes precedence over entities, which is ignored in the same call.
      required: false
      selector:
        boolean: {}
